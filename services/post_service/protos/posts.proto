syntax = "proto3";

package posts;

import "google/protobuf/timestamp.proto";

service PostService {
    rpc CreatePost (CreatePostRequest) returns (PostResponse);
    rpc GetPost (GetPostRequest) returns (PostResponse);
    rpc UpdatePost (UpdatePostRequest) returns (PostResponse);
    rpc DeletePost (DeletePostRequest) returns (DeletePostResponse);
    rpc ListPosts (ListPostsRequest) returns (ListPostsResponse);
    
    rpc ViewPost (ViewPostRequest) returns (ViewPostResponse);
    rpc LikePost (LikePostRequest) returns (LikePostResponse);
    rpc UnlikePost (UnlikePostRequest) returns (UnlikePostResponse);
    rpc CommentPost (CommentPostRequest) returns (CommentPostResponse);
    rpc GetPostComments (GetPostCommentsRequest) returns (GetPostCommentsResponse);
}

message Post {
    string id = 1;
    string title = 2;
    string description = 3;
    int64 author_id = 4;
    google.protobuf.Timestamp created_at = 5;
    google.protobuf.Timestamp updated_at = 6;
    bool is_private = 7;
    repeated string tags = 8;
}

message CreatePostRequest {
    string title = 1;
    string description = 2;
    int64 author_id = 3;
    bool is_private = 4;
    repeated string tags = 5;
}

message GetPostRequest {
    string id = 1;
    int64 requester_id = 2; 
}

message UpdatePostRequest {
    string id = 1;
    string title = 2;
    string description = 3;
    bool is_private = 4;
    repeated string tags = 5;
    int64 requester_id = 6;
}

message DeletePostRequest {
    string id = 1;
    int64 requester_id = 2;
}

message PostResponse {
    Post post = 1;
}

message ListPostsRequest {
    int32 page = 1;
    int32 page_size = 2;
}

message ListPostsResponse {
    repeated Post posts = 1;
    int32 total_count = 2;
    int32 page = 3;
    int32 page_size = 4;
}

message DeletePostResponse {
    string message = 1;
}

message ViewPostRequest {
    string post_id = 1;
    int64 user_id = 2;
}

message ViewPostResponse {
    bool success = 1;
    string message = 2;
}

message LikePostRequest {
    string post_id = 1;
    int64 user_id = 2;
}

message LikePostResponse {
    bool success = 1;
    string message = 2;
    int32 total_likes = 3;
}

message UnlikePostRequest {
    string post_id = 1;
    int64 user_id = 2;
}

message UnlikePostResponse {
    bool success = 1;
    string message = 2;
    int32 total_likes = 3;
}

message CommentPostRequest {
    string post_id = 1;
    int64 user_id = 2;
    string content = 3;
}

message PostComment {
    int32 id = 1;
    string post_id = 2;
    int64 user_id = 3;
    string content = 4;
    google.protobuf.Timestamp created_at = 5;
    google.protobuf.Timestamp updated_at = 6;
}

message CommentPostResponse {
    bool success = 1;
    string message = 2;
    PostComment comment = 3;
}

message GetPostCommentsRequest {
    string post_id = 1;
    int32 page = 2;
    int32 page_size = 3;
}

message GetPostCommentsResponse {
    repeated PostComment comments = 1;
    int32 total_count = 2;
    int32 page = 3;
    int32 page_size = 4;
} 